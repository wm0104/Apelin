# This branch's registered CI entry point is manual-only. Main's CI and
# Release stay independent; this artifact is never a Release input.
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apelin-sync-build-apelin-fila-optional
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ANALYTICS: "1"

jobs:
  sync-build:
    name: Sync optional branch and verify one roothide package
    if: github.event_name == 'workflow_dispatch' && github.repository == 'wm0104/Apelin' && github.ref == 'refs/heads/build/apelin-fila-optional'
    runs-on: xcode-27
    timeout-minutes: 150
    permissions:
      contents: write
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the original optional branch
        uses: actions/checkout@v4
        with:
          ref: refs/heads/build/apelin-fila-optional
          fetch-depth: 0
          persist-credentials: false

      - name: Pin branch and upstream heads, then merge
        id: sync
        env:
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/wm0104/Apelin.git refs/heads/build/apelin-fila-optional
          base="$(git rev-parse FETCH_HEAD)"
          if [[ "$(git rev-parse HEAD)" != "$base" ]]; then
            echo "error: optional branch changed during checkout; retry manually" >&2
            exit 1
          fi
          if [[ "$base" != "$DISPATCH_SHA" ]]; then
            echo "error: optional branch changed since dispatch; retry manually" >&2
            exit 1
          fi
          git fetch --no-tags https://github.com/owngoal-dev/Apelin.git refs/heads/main
          upstream="$(git rev-parse FETCH_HEAD)"
          export GIT_AUTHOR_NAME=Codex GIT_AUTHOR_EMAIL=noreply@openai.com
          export GIT_COMMITTER_NAME=Codex GIT_COMMITTER_EMAIL=noreply@openai.com
          git config user.name Codex
          git config user.email noreply@openai.com
          # A conflict fails the run. Never resolve by discarding either side.
          git merge --no-ff --no-edit "$upstream"
          head="$(git rev-parse HEAD)"
          printf 'base=%s\nupstream=%s\nhead=%s\n' "$base" "$upstream" "$head" >> "$GITHUB_OUTPUT"
          printf 'Optional base: %s\nUpstream main: %s\nBuild HEAD: %s\n' "$base" "$upstream" "$head"
          printf '### Optional branch build\n\nBase: `%s`\n\nUpstream main: `%s`\n\nBuild HEAD: `%s`\n' "$base" "$upstream" "$head" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify optional dependency policy before building
        run: |
          set -euo pipefail
          python3 Scripts/verify-optional-deb.py --control Packaging/DEBIAN/control

      - name: Configure build paths
        run: |
          set -euo pipefail
          echo "DERIVED_DATA=$RUNNER_TEMP/apelin-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Select Xcode 27.1
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          xcodebuild -version
          echo "iPhoneOS SDK $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Run host tests
        run: |
          set -euo pipefail
          make harness SWIFTPM_SCRATCH="$RUNNER_TEMP/apelin-spm"

      - name: Restore the runtime
        id: runtime
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/apelin-old-runtime
          key: apelin-old-runtime-ios15.5-${{ hashFiles('Scripts/old-runtime/runtime-root.py') }}

      - name: Run old iOS runtime checks
        run: |
          set -euo pipefail
          make old-runtime

      # Retain the 5.4 GB runtime even if its checks failed, as in main's CI.
      - name: Keep the runtime
        if: always() && steps.runtime.outcome == 'success' && steps.runtime.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/apelin-old-runtime
          key: ${{ steps.runtime.outputs.cache-primary-key }}

      - name: Install packaging dependencies
        run: |
          set -euo pipefail
          formulae=()
          command -v dpkg-deb >/dev/null 2>&1 || formulae+=(dpkg)
          command -v ldid >/dev/null 2>&1 || formulae+=(ldid)
          command -v zstd >/dev/null 2>&1 || formulae+=(zstd)
          if (( ${#formulae[@]} > 0 )); then
            brew install "${formulae[@]}"
          fi

      - name: Run optional packaging and workflow behavior tests
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s Tests/Packaging -p 'test_*.py' -v

      - name: Build, package and verify only the roothide IDE
        run: |
          set -euo pipefail
          # Refuse stale output on a persistent runner; never upload old bytes.
          if [[ -e build/Packages || -L build/Packages ]]; then
            echo "error: build/Packages already exists; a clean workspace is required" >&2
            exit 1
          fi
          make deb FLAVOR=roothide CONFIGURATION=Release SKIP_HARNESS=1 DERIVED_DATA="$DERIVED_DATA" BUILD_NUMBER="$GITHUB_RUN_NUMBER"

      - name: Verify the closed single-DEB output set
        id: package
        run: |
          set -euo pipefail
          shopt -s nullglob dotglob
          files=(build/Packages/*)
          if (( ${#files[@]} != 1 )); then
            echo "error: build/Packages must contain exactly one file" >&2
            exit 1
          fi
          deb="${files[0]}"
          version="$(make --no-print-directory print-version)"
          expected="build/Packages/wiki.qaq.apelin_${version}_iphoneos-arm64e.deb"
          if [[ "$deb" != "$expected" || ! -f "$deb" || -L "$deb" ]]; then
            echo "error: expected one regular Apelin iphoneos-arm64e DEB" >&2
            exit 1
          fi
          python3 Scripts/verify-optional-deb.py --deb "$deb"
          shasum -a 256 "$deb"
          printf 'deb=%s\n' "$deb" >> "$GITHUB_OUTPUT"

      - name: Push only the fully validated merge to the original branch
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ steps.sync.outputs.base }}
          BUILD_SHA: ${{ steps.sync.outputs.head }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$BUILD_SHA" ]]
          git diff --quiet
          git diff --cached --quiet
          remote="$(git -c credential.helper= -c 'credential.helper=!gh auth git-credential' ls-remote --exit-code https://github.com/wm0104/Apelin.git refs/heads/build/apelin-fila-optional)"
          read -r current ref <<< "$remote"
          if [[ "$current" != "$BASE_SHA" || "$ref" != refs/heads/build/apelin-fila-optional ]]; then
            echo "error: optional branch changed since sync began; nothing pushed or uploaded" >&2
            exit 1
          fi
          # Ordinary push only: a concurrent non-fast-forward update is rejected.
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push https://github.com/wm0104/Apelin.git HEAD:refs/heads/build/apelin-fila-optional

      - name: Upload the single verified DEB
        uses: actions/upload-artifact@v4
        with:
          name: apelin-arm64e-${{ github.run_id }}
          overwrite: true
          path: ${{ steps.package.outputs.deb }}
          if-no-files-found: error
          retention-days: 30
