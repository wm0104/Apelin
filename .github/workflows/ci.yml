# Upstream build/test steps, preceded by an independent source-sync workflow.
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

# Serialize manual sync-and-build runs for the one maintained branch.
concurrency:
  group: apelin-sync-build-apelin-fila-optional
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ANALYTICS: "1"

# Both jobs run on the Xcode 27 image, the one with the iOS 27.1 SDK the
# packages are linked against (`IOS_SDK_TIER` in the Makefile: the tier an
# iPhone Duo runs edge to edge, with vertical bars). Its default Xcode may be
# newer than 27.1, so 27.1 is named rather than the newest found.
jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'wm0104/Apelin' && github.ref == 'refs/heads/build/apelin-fila-optional'
    permissions:
      contents: write
    uses: ./.github/workflows/sync-upstream.yml

  # Seconds, where the build takes minutes, so a broken host test says so
  # long before the packages would.
  test:
    needs: sync
    name: Host tests
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.sha }}
          persist-credentials: false

      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          xcodebuild -version
          echo "iPhoneOS SDK $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Run host tests
        run: make harness SWIFTPM_SCRATCH="$RUNNER_TEMP/apelin-spm"

  # The vphones run iOS 26 and 27, where `Data` through an @objc thunk costs
  # nothing; on an older Foundation unpacking a toolchain ran out of memory.
  # The runtime is kept between runs: its first download is 5.4 GB.
  old-runtime:
    needs: sync
    name: Old iOS runtime
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.sha }}
          persist-credentials: false

      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          xcodebuild -version

      - name: Restore the runtime
        id: runtime
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/apelin-old-runtime
          key: apelin-old-runtime-ios15.5-${{ hashFiles('Scripts/old-runtime/runtime-root.py') }}

      - name: Run the checks
        run: make old-runtime

      # Kept whatever the checks said: a failing commit's retry should not
      # download 5.4 GB again.
      - name: Keep the runtime
        if: always() && steps.runtime.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/apelin-old-runtime
          key: ${{ steps.runtime.outputs.cache-primary-key }}

  build:
    needs: [sync, test, old-runtime]
    name: Build and verify Debian packages
    runs-on: xcode-27
    timeout-minutes: 90

    steps:
      - name: Configure build paths
        shell: bash
        run: |
          set -euo pipefail
          echo "DERIVED_DATA=$RUNNER_TEMP/apelin-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.sha }}
          persist-credentials: false

      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          xcodebuild -version
          echo "iPhoneOS SDK $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Install packaging dependencies
        shell: bash
        run: |
          set -euo pipefail
          formulae=()
          command -v dpkg-deb >/dev/null 2>&1 || formulae+=(dpkg)
          command -v ldid >/dev/null 2>&1 || formulae+=(ldid)
          command -v zstd >/dev/null 2>&1 || formulae+=(zstd)
          if (( ${#formulae[@]} > 0 )); then
            brew install "${formulae[@]}"
          fi

      # The original host and old-runtime jobs passed for this exact commit.
      # Use upstream's existing single-flavour target, not deb-all.
      - name: Build, package and verify the roothide IDE
        run: make deb FLAVOR=roothide CONFIGURATION=Release SKIP_HARNESS=1 DERIVED_DATA="$DERIVED_DATA" BUILD_NUMBER="$GITHUB_RUN_NUMBER"

      - name: Verify the single arm64e DEB
        id: package
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob dotglob
          files=(build/Packages/*)
          if (( ${#files[@]} != 1 )); then
            echo "error: expected exactly one package output" >&2
            exit 1
          fi
          deb="${files[0]}"
          version="$(make --no-print-directory print-version)"
          if [[ "$deb" != "build/Packages/wiki.qaq.apelin_${version}_iphoneos-arm64e.deb" || ! -f "$deb" || -L "$deb" ]]; then
            echo "error: expected one regular Apelin arm64e DEB" >&2
            exit 1
          fi
          [[ "$(dpkg-deb -f "$deb" Package)" == wiki.qaq.apelin ]]
          [[ "$(dpkg-deb -f "$deb" Version)" == "$version" ]]
          [[ "$(dpkg-deb -f "$deb" Architecture)" == iphoneos-arm64e ]]
          python3 - "$deb" <<'PY'
          import re, subprocess, sys
          text = subprocess.check_output(['dpkg-deb', '-f', sys.argv[1], 'Depends', 'Pre-Depends'], text=True)
          if re.search(r'(?<![a-z0-9+.-])wiki\.qaq\.(?:irisin|fila)(?![a-z0-9+.-])', text):
              raise SystemExit('error: DEB contains an Irisin/Fila hard dependency')
          print('Verified single arm64e DEB; Irisin and Fila are not hard dependencies')
          PY
          shasum -a 256 "$deb"
          printf 'deb=%s\n' "$deb" >> "$GITHUB_OUTPUT"

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: apelin-arm64e-${{ github.run_id }}
          overwrite: true
          path: ${{ steps.package.outputs.deb }}
          if-no-files-found: error
          retention-days: 30
